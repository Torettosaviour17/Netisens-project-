{% extends "base.html" %}
{% block title %}Create an account{% endblock %}
{% block content %}
<section class="card login">
  <h1>Create an account</h1>
  <form method="post" class="fields">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Full name <input name="name" autocomplete="name" maxlength="80" required></label>
    <label>Email <input type="email" name="email" autocomplete="email" maxlength="254" required></label>
    <div class="visibility-field">
      <label for="password">Password</label>
      <div class="visibility-row">
        <input id="password" type="password" name="password" autocomplete="new-password" minlength="8" maxlength="128" required>
        <button type="button" class="secondary" data-show-field="password" aria-controls="password" aria-label="Show password" hidden>Show</button>
      </div>
    </div>
    <div class="visibility-field">
      <label for="account_id">Account ID</label>
      <div class="visibility-row">
        <input id="account_id" type="password" name="account_id" aria-describedby="id-help" required>
        <button type="button" class="secondary" data-show-field="account_id" aria-controls="account_id" aria-label="Show account id" hidden>Show</button>
      </div>
    </div>
    <small id="id-help">Students, enter <strong>student</strong> in lowercase. Teachers, enter the ID shared with you privately.</small>
    <button>Create account</button>
  </form>
  <p>Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
</section>
<script src="/static/visibility.js" defer></script>
{% endblock %}
