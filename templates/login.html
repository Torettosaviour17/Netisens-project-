{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="card login">
  <h1>Sign in</h1>
  <p>Use your student or teacher account.</p>
  <form method="post" class="fields">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Email <input type="email" name="email" autocomplete="username" required></label>
    <div class="visibility-field">
      <label for="password">Password</label>
      <div class="visibility-row">
        <input id="password" type="password" name="password" autocomplete="current-password" required>
        <button type="button" class="secondary" data-show-field="password" aria-controls="password" aria-label="Show password" hidden>Show</button>
      </div>
    </div>
    <button>Sign in</button>
  </form>
  <p>New to the portal? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
<script src="/static/visibility.js" defer></script>
{% endblock %}
