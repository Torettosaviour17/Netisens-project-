<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} | Netisens</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='2') }}">
</head>
<body>
  <header class="topbar">
    <div class="wrap bar">
      <a class="brand" href="{{ url_for('login') }}">Netisens Student Submission Portal</a>
    </div>
  </header>
  <main class="wrap">
    {% for message in get_flashed_messages() %}
      <p class="notice" role="status">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  {% if g.user %}
  <footer class="wrap">
    <div class="account-footer">
      <p>Signed in as <strong>{{ g.user.name }}</strong></p>
      <form method="post" action="{{ url_for('logout') }}">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button class="secondary">Sign out</button>
      </form>
    </div>
  </footer>
  {% endif %}
</body>
</html>
